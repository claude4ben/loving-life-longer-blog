# Dependabot: GitHub checks the site's software packages and the test workflow's actions every week and
# opens a pull request when an update is available. Security fixes are raised straight away.
# Each pull request runs the automated tests; merge it if they pass.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/London
    # One pull request for all small updates, instead of one per package.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    # Big (major) upgrades of the core tools change how the site is built and need hands-on work and checks
    # the tests can't cover (e.g. the Keystatic editor screen), so they're done deliberately, not by Dependabot.
    ignore:
      - dependency-name: astro
        update-types: [version-update:semver-major]
      - dependency-name: '@astrojs/*'
        update-types: [version-update:semver-major]
      - dependency-name: '@keystatic/*'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
