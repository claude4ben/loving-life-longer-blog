name: Tests and deploy

# Every push to main and every pull request is checked. The live site is only updated after every check
# passes: the deploy step then asks Cloudflare Pages to build and publish main (Cloudflare's own automatic
# publishing is switched off, so nothing goes live unchecked).
#
# Content-only changes (Keystatic saves to src/content/) get the checks that look at content: the real
# build and Lighthouse. The browser tests run on a frozen sample of the content, so they only run when code
# has changed since the last successful check. A newer push cancels an older run still in progress, so a
# burst of saves only checks and publishes the latest.
on:
  push:
    branches: [main]
    paths: ['**', '!docs/**', '!README.md', '!CLAUDE.md']
  pull_request:
    paths: ['**', '!docs/**', '!README.md', '!CLAUDE.md']
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, to compare with the last successful check
      - name: What changed since the last successful check?
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base=$(gh run list --workflow "${{ github.workflow }}" --branch main --status success --limit 1 --json headSha --jq '.[0].headSha' 2>/dev/null || true)
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No earlier successful check to compare with, so everything runs."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" HEAD)
          echo "Changed since $base:"; echo "$changed"
          # Anything outside the content folder and the docs counts as code.
          if printf '%s\n' "$changed" | grep -vE '^(src/content/|docs/|README\.md$|CLAUDE\.md$|$)' | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "Code changed: running every check."
          else
            echo "code=false" >> "$GITHUB_OUTPUT"; echo "Only content changed: build and Lighthouse only."
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the real content builds
        run: npm run build
      - name: Speed and quality check (Lighthouse, phone settings, real content)
        run: npx lhci autorun --config=lighthouserc.cjs
      - if: steps.changes.outputs.code == 'true'
        run: npx playwright install --with-deps chromium
      - name: Automated tests (on a frozen sample of the content; only when code changed)
        if: steps.changes.outputs.code == 'true'
        run: npm test
        env:
          WRANGLER_SEND_METRICS: 'false'
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: lighthouse-report/
          retention-days: 14

  deploy:
    # Only for main, only after every test above has passed.
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: { group: deploy-production, cancel-in-progress: false }
    steps:
      - name: Ask Cloudflare Pages to publish main
        env:
          HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::CLOUDFLARE_DEPLOY_HOOK isn't set up yet, so Cloudflare's own automatic publishing is still doing this job."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Cloudflare is building and publishing main."
