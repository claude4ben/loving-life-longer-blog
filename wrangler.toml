# Cloudflare Pages settings for the site (Cloudflare reads this file on every deploy).
name = "loving-life-longer-blog"
pages_build_output_dir = "./dist"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Comments and likes database (Cloudflare D1). The site creates its tables automatically.
[[d1_databases]]
binding = "DB"
database_name = "lll-blog"
database_id = "0bc01f85-fd80-48ed-b0b8-633fad218774"

[vars]
# "true" = comments wait for Ben's approval before appearing; "false" = appear straight away.
COMMENTS_NEED_APPROVAL = "false"
# The /admin password is NOT here: it's a secret called ADMIN_PASSWORD, set in the Cloudflare
# dashboard (Workers & Pages > loving-life-longer-blog > Settings > Variables and Secrets).

# The photo crop editor (/admin/photos/) saves changes into this repository on GitHub. It needs a secret
# called GITHUB_TOKEN (a GitHub key that can edit this repository's contents), set in the dashboard.
GITHUB_REPO = "claude4ben/loving-life-longer-blog"
GITHUB_BRANCH = "main"
